<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cognis</title>
<meta name="description" content="Avaliação experimental de raciocínio: 36 questões originais, correção automática e análise de desempenho. Funciona offline, sem cadastro.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: uma coluna central; telas (início, avaliação, resultado) trocadas por JS */
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #080c16; --surface: #0f1524; --surface-2: #161e32; --line: #28344e; --ink: #ecf0f8; --muted: #a0acc4; --faint: #808ca6;
  --accent: #609cff; --accent-ink: #06102a; --violet: #a08cff; --good: #34c478; --bad: #f06868; --warn: #f5b848; --series: #3987e5;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f7f8fb; --surface: #ffffff; --surface-2: #f0f3f9; --line: #dae0ec; --ink: #0e1424; --muted: #4a5670; --faint: #626c84;
  --accent: #2460d6; --accent-ink: #ffffff; --violet: #6250d6; --good: #00803c; --bad: #c42828; --warn: #a06400; --series: #2a78d6;
}
:root { --display: "Instrument Serif", Georgia, serif; --sans: "Inter", system-ui, -apple-system, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; min-height: 100vh;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; font-weight: 400; }
.display { font-family: var(--display); letter-spacing: -0.01em; text-wrap: balance; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 12px; border: 1px solid transparent; cursor: pointer; font-weight: 500; transition: filter .15s, background-color .15s, border-color .15s; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:not(:disabled):hover { filter: brightness(1.1); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-secondary:hover { border-color: var(--accent); }
.btn-ghost { background: transparent; color: var(--muted); }
.btn-ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn-danger { background: var(--bad); color: #fff; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
.notice { display: flex; gap: 12px; border: 1px solid; border-radius: 12px; padding: 14px; font-size: 14px; color: var(--muted); }
.notice b { color: var(--ink); }
.notice.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 8%, transparent); }
.notice.info { border-color: color-mix(in srgb, var(--accent) 35%, transparent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.grid-gap { display: grid; gap: 16px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 24px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* Início */
.hero { padding-block: 40px 24px; display: grid; gap: 18px; }
.hero h1 { font-size: clamp(40px, 8vw, 64px); line-height: 1.02; }
.hero h1 em { color: var(--accent); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.fact b { display: block; font-family: var(--mono); font-size: 26px; }
.fact span { font-size: 13px; color: var(--muted); }
.consent { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); font-size: 14px; color: var(--muted); cursor: pointer; }
.consent input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
ul.rules { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--muted); }
ul.rules b { color: var(--ink); }

/* Avaliação */
.testbar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.testbar-row { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.timer { white-space: nowrap; font-family: var(--mono); font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 8px; color: var(--muted); }
.timer.low { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.progress { height: 4px; background: var(--surface-2); }
.progress > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--violet)); transition: width .3s; }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
.prompt { white-space: pre-line; font-size: clamp(19px, 3.2vw, 24px); line-height: 1.5; margin: 0; }
fieldset { min-width: 0; }
.options { display: grid; gap: 12px; }
.options.figs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opt { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; transition: border-color .15s, background-color .15s; min-width: 0; }
.opt:hover { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt.checked { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.opt .letter { width: 32px; height: 32px; flex-shrink: 0; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; font-family: var(--mono); font-size: 14px; color: var(--muted); }
.opt.checked .letter { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.figs .opt { flex-direction: column; align-items: stretch; gap: 6px; padding: 10px; }
.figs .opt .letter { align-self: flex-start; }
.figs .opt svg { width: 100%; max-width: 110px; aspect-ratio: 1; align-self: center; }
.opt .txt { font-size: 17px; overflow-wrap: anywhere; }
.matrix { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 360px; margin: 0 auto; padding: 8px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface-2); }
.cell { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 8px; display: grid; place-items: center; }
.cell svg { width: 100%; height: 100%; }
.cell.missing { border: 2px dashed color-mix(in srgb, var(--accent) 65%, transparent); background: color-mix(in srgb, var(--accent) 6%, transparent); font-family: var(--display); font-size: 40px; color: var(--accent); }
.sequence { display: grid; gap: 8px; max-width: 560px; margin: 0 auto; }
.model { width: 160px; margin: 0 auto; text-align: center; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.model .cell { margin-bottom: 6px; }
.nav .btn { white-space: nowrap; }
.nav { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding-top: 20px; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; }
.qgrid button { height: 42px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-family: var(--mono); cursor: pointer; }
.qgrid button.ans { background: color-mix(in srgb, var(--accent) 15%, transparent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--ink); }
.qgrid button.cur { outline: 2px solid var(--accent); }
.stimulus { text-align: center; padding: 32px 16px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 18px; background: var(--surface); }
.stimulus .content { font-family: var(--mono); font-size: clamp(24px, 6vw, 46px); letter-spacing: .2em; word-spacing: .3em; margin: 24px 0; user-select: none; -webkit-user-select: none; }
.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; max-width: 360px; margin: 0 auto; }
.bar > div { height: 100%; background: var(--accent); }
.hint { font-size: 12px; color: var(--faint); }
dialog { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); padding: 0; width: min(92vw, 460px); }
dialog::backdrop { background: rgb(0 0 0 / .55); }
dialog .inner { padding: 22px; display: grid; gap: 14px; }
.row-end { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }

/* Resultado */
.score { display: grid; gap: 20px; grid-template-columns: auto 1fr; align-items: center; }
.score .big { font-family: var(--display); font-size: clamp(64px, 14vw, 96px); line-height: 1; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); }
.stat small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.stat b { font-family: var(--mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.stack { display: flex; gap: 2px; height: 14px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
.bars { display: grid; gap: 10px; }
.barrow { display: grid; grid-template-columns: minmax(0, 11rem) 1fr 6.5rem; gap: 10px; align-items: center; font-size: 14px; }
.barrow .track { position: relative; height: 10px; border-radius: 99px; background: var(--surface-2); }
.barrow .fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--series); }
.barrow .ref { position: absolute; top: -4px; bottom: -4px; width: 1px; background: var(--ink); opacity: .6; }
.barrow .val { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.times { display: flex; align-items: flex-end; gap: 2px; height: 120px; }
.times div { flex: 1; border-radius: 3px 3px 0 0; min-height: 2px; }
.cols2 { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.list li { border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.list ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
.review li { border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; background: var(--surface); }
.review .ropts { display: grid; gap: 6px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0; padding: 0; list-style: none; }
.review .ropts.figs { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.review .ropts li { padding: 8px; border-radius: 10px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.review .ropts.figs li { flex-direction: column; }
.review .ropts svg { width: 46px; height: 46px; }
.review .ok { border-color: color-mix(in srgb, var(--good) 60%, transparent); background: color-mix(in srgb, var(--good) 8%, transparent); }
.review .no { border-color: color-mix(in srgb, var(--bad) 60%, transparent); background: color-mix(in srgb, var(--bad) 8%, transparent); }
.tag { font-size: 12px; border-radius: 99px; padding: 2px 10px; font-weight: 500; }
.tag.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.tag.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.tag.na { background: var(--surface-2); color: var(--muted); }
.ropts .tag { color: var(--ink); } /* sobre fundo colorido: texto neutro; o rótulo diz o estado */
table.hist { width: 100%; border-collapse: collapse; font-size: 14px; }
table.hist th, table.hist td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
table.hist th { color: var(--faint); font-weight: 500; }
.scroll-x { overflow-x: auto; }
.prose p { color: var(--muted); margin: 0 0 10px; }
footer.foot { border-top: 1px solid var(--line); margin-top: 48px; padding-block: 20px 32px; font-size: 13px; color: var(--faint); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 600px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fact b { font-size: 22px; }
  .nav .btn { padding: 0 12px; }
  .testbar-row > svg { display: none; }
  #gridbtn { order: 3; flex-basis: 100%; }
  .cols2 { grid-template-columns: 1fr; }
  .score { grid-template-columns: 1fr; }
  .options.figs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .barrow { grid-template-columns: minmax(0, 7.5rem) 1fr 5.5rem; font-size: 13px; }
  .review .ropts { grid-template-columns: 1fr; }
  .review .ropts.figs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="live" class="sr" aria-live="polite"></div>
<dialog id="dlg-finish" aria-labelledby="dlg-finish-t"><div class="inner">
  <h2 id="dlg-finish-t" class="display" style="font-size:28px">Encerrar a avaliação?</h2>
  <p class="muted" id="dlg-finish-text" style="margin:0"></p>
  <div class="row-end"><button class="btn btn-secondary" data-close>Continuar respondendo</button><button class="btn btn-primary" id="dlg-finish-ok">Encerrar e ver resultado</button></div>
</div></dialog>
<dialog id="dlg-abandon" aria-labelledby="dlg-abandon-t"><div class="inner">
  <h2 id="dlg-abandon-t" class="display" style="font-size:28px">Abandonar a avaliação?</h2>
  <p class="muted" style="margin:0">Uma avaliação abandonada não gera resultado e não pode ser retomada.</p>
  <div class="row-end"><button class="btn btn-secondary" data-close>Voltar</button><button class="btn btn-danger" id="dlg-abandon-ok">Abandonar</button></div>
</div></dialog>
<dialog id="dlg-clear" aria-labelledby="dlg-clear-t"><div class="inner">
  <h2 id="dlg-clear-t" class="display" style="font-size:28px">Apagar o histórico?</h2>
  <p class="muted" style="margin:0">Todos os resultados salvos neste navegador serão apagados. Isso não pode ser desfeito.</p>
  <div class="row-end"><button class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-danger" id="dlg-clear-ok">Apagar</button></div>
</div></dialog>

<script id="cognis-data" type="application/json">/*__DATA__*/</script>
<script>
"use strict";
(function () {
  var DATA = JSON.parse(document.getElementById("cognis-data").textContent);
  var QUESTIONS = DATA.questions, CATEGORIES = DATA.categories, VERSION = DATA.version;
  var QBY = {}; QUESTIONS.forEach(function (q) { QBY[q.id] = q; });
  var CBY = {}; CATEGORIES.forEach(function (c) { CBY[c.id] = c; });
  var STORE = "cognis-local-v1", LABELS = ["A", "B", "C", "D", "E", "F"];
  var DIFF = { 1: "Fácil", 2: "Médio", 3: "Difícil" };
  var app = document.getElementById("app");

  // ---------------------------------------------------------------- armazenamento
  var memory = { current: null, history: [] };
  function load() {
    try { var raw = localStorage.getItem(STORE); if (raw) { var d = JSON.parse(raw); if (d && Array.isArray(d.history)) memory = d; } } catch (e) {}
    return memory;
  }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(memory)); } catch (e) {} }

  // ---------------------------------------------------------------- utilidades
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pct(n, d) { return d ? Math.round((1000 * n) / d) / 10 : 0; }
  function fmtPct(n) { return n.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "%"; }
  function fmtNum(n) { return n.toLocaleString("pt-BR", { maximumFractionDigits: 1 }); }
  function fmtDur(ms) { var t = Math.max(0, Math.round(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    if (h) return h + " h " + String(m).padStart(2, "0") + " min"; if (m) return m + " min " + String(s).padStart(2, "0") + " s"; return s + " s"; }
  function fmtClock(ms) { var t = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); }
  function fmtDate(ts) { return new Date(ts).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }); }
  function announce(t) { document.getElementById("live").textContent = t; }

  // ---------------------------------------------------------------- sorteio (mesmo algoritmo do servidor)
  function mulberry32(seed) { var a = seed >>> 0; return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(items, rand) { var arr = items.slice(); for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }
  function spread(items, prev) {
    var rem = items.slice(), out = [], last = prev;
    while (rem.length) {
      var counts = {}; rem.forEach(function (q) { counts[q.category] = (counts[q.category] || 0) + 1; });
      var idx = -1;
      for (var i = 0; i < rem.length; i++) { var c = rem[i].category; if (c === last) continue; if (idx === -1 || counts[c] > counts[rem[idx].category]) idx = i; }
      if (idx === -1) idx = 0;
      var next = rem.splice(idx, 1)[0]; out.push(next); last = next.category;
    }
    return out;
  }
  function selectItems(seed) {
    var rand = mulberry32(seed), byD = { 1: [], 2: [], 3: [] };
    var bank = QUESTIONS.filter(function (q) { return q.active && q.status === "reviewed"; }).sort(function (a, b) { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });
    VERSION.blueprint.cells.forEach(function (cell) {
      [1, 2, 3].forEach(function (d) {
        var n = cell.counts[String(d)]; if (!n) return;
        var pool = bank.filter(function (q) { return q.category === cell.category && q.difficulty === d; });
        if (pool.length < n) throw new Error("Banco insuficiente: " + cell.category + "/" + d);
        Array.prototype.push.apply(byD[d], shuffle(pool, rand).slice(0, n));
      });
    });
    var ordered = [];
    [1, 2, 3].forEach(function (d) { var prev = ordered.length ? ordered[ordered.length - 1].category : undefined; Array.prototype.push.apply(ordered, spread(shuffle(byD[d], rand), prev)); });
    return ordered.map(function (q) { return { qid: q.id, order: shuffle(q.options.map(function (o) { return o.id; }), rand) }; });
  }

  // ---------------------------------------------------------------- pontuação (algoritmo idc-1.0)
  function score(at) {
    var items = at.items.map(function (it, pos) {
      var q = QBY[it.qid], r = at.responses[it.qid] || { sel: null, time: 0 };
      return { pos: pos, qid: q.id, category: q.category, difficulty: q.difficulty, sel: r.sel, time: Math.max(0, Math.round(r.time || 0)), correct: r.sel === null || r.sel === undefined ? null : r.sel === q.answer };
    });
    var correct = items.filter(function (i) { return i.correct === true; }).length;
    var unanswered = items.filter(function (i) { return i.correct === null; }).length;
    var cats = []; items.forEach(function (i) { if (cats.indexOf(i.category) < 0) cats.push(i.category); });
    var byCat = cats.map(function (c) { var s = items.filter(function (i) { return i.category === c; }), k = s.filter(function (i) { return i.correct === true; }).length, u = s.filter(function (i) { return i.correct === null; }).length;
      return { category: c, total: s.length, correct: k, incorrect: s.length - k - u, unanswered: u, percent: pct(k, s.length) }; });
    var byDiff = [1, 2, 3].map(function (d) { var s = items.filter(function (i) { return i.difficulty === d; }), k = s.filter(function (i) { return i.correct === true; }).length; return { difficulty: d, total: s.length, correct: k, percent: pct(k, s.length) }; }).filter(function (d) { return d.total > 0; });

        return '<button data-go="' + i + '" class="' + (a ? "ans " : "") + (i === ui.pos ? "cur" : "") + '" aria-label="Questão ' + (i + 1) + (a ? ", respondida" : ", sem resposta") + '">' + (i + 1) + "</button>"; }).join("") +
        '</div><div><button class="btn btn-ghost" id="abandon" style="color:var(--bad);padding:0">Abandonar esta avaliação</button></div></div>';
    }
    box.innerHTML = h;
    box.querySelectorAll('input[name="opt"]').forEach(function (inp) { inp.addEventListener("change", function () { choose(Number(inp.value)); }); });
    var rv = document.getElementById("reveal"); if (rv) rv.addEventListener("click", reveal);
    document.getElementById("prev").addEventListener("click", function () { go(ui.pos - 1); });
    document.getElementById("next").addEventListener("click", function () { if (last) { commitTime(); openFinish(); } else go(ui.pos + 1); });
    document.getElementById("gridbtn").addEventListener("click", function () { commitTime(); ui.showGrid = !ui.showGrid; drawQuestion(false); });
    box.querySelectorAll("[data-go]").forEach(function (b) { b.addEventListener("click", function () { var to = Number(b.dataset.go); if (to === ui.pos) { ui.showGrid = false; drawQuestion(false); } else go(to); }); });
    var ab = document.getElementById("abandon"); if (ab) ab.addEventListener("click", function () { document.getElementById("dlg-abandon").showModal(); });
    if (focus) { var qh = document.getElementById("qh"); if (qh) qh.focus(); window.scrollTo(0, 0); }
  }
  function choose(i) {
    var at = memory.current, it = at.items[ui.pos], q = QBY[it.qid];
    if (q.format === "memory" && !at.memShown[q.id]) return;
    var now = Date.now(), r = at.responses[q.id] || { sel: null, time: 0 };
    r.time = Math.min((r.time || 0) + Math.max(0, now - ui.viewStart), 15 * 60 * 1000); ui.viewStart = now;
    r.sel = it.order[i]; at.responses[q.id] = r; save();
    announce("Resposta " + LABELS[i] + " salva.");
    drawQuestion(false);
  }
  function reveal() {
    var at = memory.current, q = QBY[at.items[ui.pos].qid];
    at.memShown[q.id] = true; save(); // marcado antes de exibir: recarregar não reapresenta o estímulo
    var total = q.stimulus.exposureSeconds * 1000, ends = Date.now() + total;
    ui.mem = { qid: q.id, ends: ends };
    drawQuestion(false);
    var iv = setInterval(function () {
      var left = ends - Date.now(), b = document.getElementById("membar"), t = document.getElementById("memleft");
      if (b) b.style.width = Math.max(0, (100 * left) / total) + "%";
      if (t) t.textContent = Math.max(0, Math.ceil(left / 1000)) + " s";
      if (left <= 0) { clearInterval(iv); if (ui.mem && ui.mem.qid === q.id) { ui.mem = null; if (memory.current && memory.current.items[ui.pos].qid === q.id) drawQuestion(false); } }
    }, 100);
  }
  function openFinish() {
    var at = memory.current, done = answeredCount(at), miss = at.items.length - done;
    document.getElementById("dlg-finish-text").innerHTML = "Você respondeu <b style=\"color:var(--ink)\">" + done + "</b> de " + at.items.length + " questões." + (miss ? " As <b style=\"color:var(--ink)\">" + miss + "</b> sem resposta contarão como não respondidas." : "") + " Depois de encerrar, não será possível alterar as respostas.";
    document.getElementById("dlg-finish").showModal();
  }
  document.getElementById("dlg-finish-ok").addEventListener("click", function () { document.getElementById("dlg-finish").close(); finish(false); });
  document.getElementById("dlg-abandon-ok").addEventListener("click", function () { document.getElementById("dlg-abandon").close(); stopTimer(); memory.current = null; save(); renderHome(); });
  function finish(byTime) {
    var at = memory.current; if (!at) return renderHome();
    stopTimer(); if (!byTime) commitTime();
    document.querySelectorAll("dialog[open]").forEach(function (d) { d.close(); });
    var past = Date.now() > at.deadline;
    at.completedAt = past ? at.deadline : Date.now();
    var res = { id: at.id, seed: at.seed, version: at.version, startedAt: at.startedAt, completedAt: at.completedAt, expired: past || byTime, items: at.items, responses: at.responses, score: score(at) };
    memory.history.push(res); memory.current = null; save();
    renderResult(res);
  }
  document.addEventListener("keydown", function (e) {
    var at = memory.current; if (!at || !document.getElementById("q") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (document.querySelector("dialog[open]")) return;
    var q = QBY[at.items[ui.pos].qid]; if (q.format === "memory" && !at.memShown[q.id]) return; if (ui.mem && ui.mem.qid === q.id) return;
    var k = e.key.toUpperCase(), i = "ABCDEF".indexOf(k); if (i < 0) i = "123456".indexOf(k);
    if (k.length === 1 && i >= 0 && i < at.items[ui.pos].order.length) { e.preventDefault(); choose(i); }
  });
  document.addEventListener("visibilitychange", function () { if (!memory.current || !document.getElementById("q")) return; if (document.visibilityState === "hidden") commitTime(); else ui.viewStart = Date.now(); });
  window.addEventListener("beforeunload", function () { if (memory.current && document.getElementById("q")) commitTime(); });

  // ---------------------------------------------------------------- resultado
  function renderResult(res) {
    stopTimer();
    var s = res.score, catName = function (id) { return CBY[id] ? CBY[id].name : id; };
    var strengths = s.byCat.filter(function (c) { return c.percent >= 75; }).sort(function (a, b) { return b.percent - a.percent; });
    var lower = s.byCat.filter(function (c) { return c.percent <= 50; }).sort(function (a, b) { return a.percent - b.percent; });
    var cats = s.byCat.slice().sort(function (a, b) { return b.percent - a.percent || (catName(a.category) < catName(b.category) ? -1 : 1); });
    function barRow(label, p, detail, ref) { return '<div class="barrow"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(label) + '">' + esc(label) + '</span><div class="track" title="' + esc(label) + ": " + fmtPct(p) + " (" + detail + ')">' + (p > 0 ? '<div class="fill" style="width:' + Math.max(1.5, p) + '%"></div>' : "") + (ref !== undefined ? '<div class="ref" style="left:' + ref + '%"></div>' : "") + '</div><span class="val">' + fmtPct(p) + ' <span class="faint">· ' + detail + "</span></span></div>"; }
    var maxT = Math.max.apply(null, s.items.map(function (i) { return i.time; }).concat([1]));
    var h = header() + '<main class="wrap grid-gap" style="padding-block:28px 0">' +
      '<div><p class="eyebrow" style="margin:0">Resultado · ' + fmtDate(res.completedAt) + '</p><h1 class="display" style="font-size:clamp(34px,6vw,48px);margin-top:6px">Análise do seu desempenho</h1></div>' +
      (res.expired ? '<div class="notice warn"><span aria-hidden="true">!</span><div><b>Tempo esgotado.</b> As questões sem resposta contaram como não respondidas.</div></div>' : "") +
      '<section class="card score"><div><p class="eyebrow" style="margin:0">Índice de Desempenho Cognitivo</p><p style="margin:6px 0 0;display:flex;align-items:baseline;gap:8px"><span class="big">' + fmtNum(s.index) + '</span><span class="mono faint">/ 100</span></p><p class="muted" style="margin:6px 0 0">' + s.correct + (s.correct === 1 ? " acerto em " : " acertos em ") + s.total + ' questões</p></div><div class="grid-gap" style="gap:12px">' +
      '<div class="stack" role="img" aria-label="Corretas ' + s.correct + ", incorretas " + s.incorrect + ", não respondidas " + s.unanswered + '">' + (s.correct ? '<div style="width:' + (100 * s.correct) / s.total + '%;background:var(--good)"></div>' : "") + (s.incorrect ? '<div style="width:' + (100 * s.incorrect) / s.total + '%;background:var(--bad)"></div>' : "") + (s.unanswered ? '<div style="width:' + (100 * s.unanswered) / s.total + '%;background:var(--faint);opacity:.5"></div>' : "") + "</div>" +
      '<div class="legend"><span><span class="dot" style="background:var(--good)"></span>✓ Corretas <b class="mono" style="color:var(--ink)">' + s.correct + '</b></span><span><span class="dot" style="background:var(--bad)"></span>× Incorretas <b class="mono" style="color:var(--ink)">' + s.incorrect + '</b></span><span><span class="dot" style="background:var(--faint);opacity:.5"></span>– Não respondidas <b class="mono" style="color:var(--ink)">' + s.unanswered + "</b></span></div>" +
      '<p class="muted" style="margin:0;font-size:14px">O índice é a porcentagem de questões respondidas corretamente. <b style="color:var(--ink)">Não é um QI</b>, não é diagnóstico e não determina inteligência, potencial ou valor de uma pessoa.</p></div></section>' +
      '<div class="stats"><div class="stat"><small>Corretas</small><b>' + s.correct + '</b></div><div class="stat"><small>Incorretas</small><b>' + s.incorrect + '</b></div><div class="stat"><small>Não respondidas</small><b>' + s.unanswered + '</b></div><div class="stat"><small>Acertos</small><b>' + fmtPct(s.percent) + '</b></div><div class="stat"><small>Tempo total</small><b>' + fmtDur(s.totalTime) + '</b></div><div class="stat"><small>Média por questão</small><b>' + fmtDur(s.meanTime) + "</b></div></div>" +
      '<section class="card grid-gap"><h2 class="display" style="font-size:26px">Desempenho por categoria</h2><p class="hint" style="margin:0">Com 3 ou 4 questões por categoria, cada questão muda o percentual em 25 a 33 pontos. A linha vertical marca seu percentual geral.</p><div class="bars">' + cats.map(function (c) { return barRow(catName(c.category), c.percent, c.correct + "/" + c.total, s.percent); }).join("") + "</div></section>" +
      '<section class="card grid-gap"><h2 class="display" style="font-size:26px">Por nível de dificuldade</h2><p class="hint" style="margin:0">Níveis atribuídos pelos autores, não calibrados com dados.</p><div class="bars">' + s.byDiff.map(function (d) { return barRow(DIFF[d.difficulty], d.percent, d.correct + "/" + d.total); }).join("") + "</div></section>" +
      '<div class="cols2"><section class="card grid-gap"><h2 class="display" style="font-size:26px">Pontos fortes nesta tentativa</h2>' + (strengths.length ? '<ul class="list">' + strengths.map(function (c) { return '<li style="display:flex;justify-content:space-between;gap:10px"><span><span style="color:var(--good)" aria-hidden="true">✓ </span>' + esc(catName(c.category)) + '</span><span class="mono muted">' + c.correct + "/" + c.total + "</span></li>"; }).join("") + "</ul>" : '<p class="muted" style="margin:0">Nenhuma categoria chegou a 75% de acertos.</p>') + "</section>" +
      '<section class="card grid-gap"><h2 class="display" style="font-size:26px">Menor desempenho nesta tentativa</h2>' + (lower.length ? '<ul class="list">' + lower.map(function (c) { return '<li><div style="display:flex;justify-content:space-between;gap:10px"><span>' + esc(catName(c.category)) + '</span><span class="mono muted">' + c.correct + "/" + c.total + '</span></div><p class="hint" style="margin:6px 0 0;text-transform:uppercase;letter-spacing:.08em">Sugestões de prática</p><ul>' + (CBY[c.category] ? CBY[c.category].practice : []).map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ul></li>"; }).join("") + "</ul>" : '<p class="muted" style="margin:0">Nenhuma categoria ficou em 50% de acertos ou menos.</p>') + "</section></div>" +
      '<section class="card grid-gap"><h2 class="display" style="font-size:26px">Tempo por questão</h2><div class="times" role="img" aria-label="Tempo gasto em cada questão">' + s.items.map(function (i) { var col = i.correct === true ? "var(--good)" : i.correct === false ? "var(--bad)" : "color-mix(in srgb, var(--faint) 50%, transparent)"; return '<div title="Questão ' + (i.pos + 1) + ": " + fmtDur(i.time) + '" style="height:' + (100 * i.time) / maxT + "%;background:" + col + '"></div>'; }).join("") + '</div><div class="legend"><span><span class="dot" style="background:var(--good)"></span>✓ Correta</span><span><span class="dot" style="background:var(--bad)"></span>× Incorreta</span><span><span class="dot" style="background:var(--faint);opacity:.5"></span>– Não respondida</span><span class="mono" style="margin-left:auto">Maior: ' + fmtDur(maxT) + "</span></div></section>" +
      '<div style="display:flex;flex-wrap:wrap;gap:10px"><button class="btn btn-primary" id="again">Fazer outra avaliação</button><button class="btn btn-secondary" id="toggle-review" aria-expanded="false">Ver relatório completo (gabarito)</button><button class="btn btn-ghost" id="home">Início</button></div>' +
      '<section id="review" hidden class="grid-gap"><h2 class="display" style="font-size:30px">Revisão das questões</h2><ol class="review" style="list-style:none;padding:0;margin:0;display:grid;gap:14px">' + reviewHtml(res) + "</ol></section>" +
      foot() + "</main>";
    app.innerHTML = h;
    document.getElementById("again").addEventListener("click", function () { renderHome(); });
    document.getElementById("home").addEventListener("click", function () { renderHome(); });
    document.getElementById("toggle-review").addEventListener("click", function () { var r = document.getElementById("review"), b = document.getElementById("toggle-review"); r.hidden = !r.hidden; b.setAttribute("aria-expanded", String(!r.hidden)); b.textContent = r.hidden ? "Ver relatório completo (gabarito)" : "Ocultar relatório completo"; if (!r.hidden) r.scrollIntoView({ behavior: "smooth", block: "start" }); });
    window.scrollTo(0, 0);
  }
  function reviewHtml(res) {
    return res.items.map(function (it, pos) {
      var q = QBY[it.qid], r = res.responses[q.id], sel = r ? r.sel : null, ok = sel === null || sel === undefined ? null : sel === q.answer;
      var byId = {}; q.options.forEach(function (o) { byId[o.id] = o; });
      var figs = q.options.some(function (o) { return o.figure; });
      var tag = ok === true ? '<span class="tag good">✓ Correta</span>' : ok === false ? '<span class="tag bad">× Incorreta</span>' : '<span class="tag na">– Não respondida</span>';
      return '<li><div class="qmeta"><span class="mono muted">Questão ' + (pos + 1) + '</span><span class="chip">' + esc(CBY[q.category].name) + '</span><span class="chip">' + DIFF[q.difficulty] + '</span><span style="margin-left:auto">' + tag + "</span></div>" +
        (q.stimulus ? '<p class="muted" style="margin:0">Conteúdo memorizado: <span class="mono" style="color:var(--ink)">' + esc(q.stimulus.text) + "</span></p>" : "") +
        '<p style="margin:0;white-space:pre-line">' + esc(q.prompt) + "</p>" + (q.figure ? '<div style="max-width:300px">' + figureHtml(q.figure) + "</div>" : "") +
        '<ul class="ropts' + (figs ? " figs" : "") + '">' + it.order.map(function (oid, i) { var o = byId[oid], isA = oid === q.answer, isS = oid === sel;
          return '<li' + (isA ? ' class="ok"' : isS ? ' class="no"' : "") + '><span class="mono faint">' + LABELS[i] + "</span>" + (o.figure ? svg(o.figure) : "<span>" + esc(o.text) + "</span>") + (isA ? '<span class="tag good" style="margin-left:auto">gabarito</span>' : isS ? '<span class="tag bad" style="margin-left:auto">sua resposta</span>' : "") + "</li>"; }).join("") + "</ul>" +
        '<p style="margin:0;padding:12px;border-radius:10px;background:var(--surface-2);font-size:14px" class="muted"><b style="color:var(--ink)">Explicação: </b>' + esc(q.explanation) + "</p></li>";
    }).join("");
  }

  // ---------------------------------------------------------------- início
  applyTheme(); load();
  if (memory.current && !expired(memory.current)) renderHome();
  else if (memory.current) { finish(true); }
  else renderHome();
})();
</script>
</body>
</html>
